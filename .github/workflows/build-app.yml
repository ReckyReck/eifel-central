# Builds Eifel Mastering Central for Mac (Apple Silicon + Intel) and Windows (64-bit) on GitHub's computers.
# Start it: github.com > eifel-central > Actions > "Build app" > Run workflow.
# When it is finished (about 10-20 minutes), the downloads are at the bottom of the run's page, under "Artifacts".
# (Later, step 9: a tag "central-vX.Y.Z" will also publish a release with the self-update files.)
name: Build app

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple Silicon + Intel)
            os: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: Eifel-Mastering-Central-Mac
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (64-bit)
            os: windows-2022
            args: --bundles nsis
            artifact: Eifel-Mastering-Central-Windows
            path: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust targets (Mac universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the build tools
        run: npm install --no-audit --no-fund

      - name: Check the code (TypeScript, strict)
        run: npm run check

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - name: Check the Mac app (ad-hoc signature, no quarantine flag)
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Eifel Mastering Central.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/"*)"; echo "Architectures: $ARCHS"
          case "$ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::not universal ($ARCHS)"; exit 1 ;; esac
          if /usr/libexec/PlistBuddy -c "Print :LSFileQuarantineEnabled" "$APP/Contents/Info.plist" >/dev/null 2>&1; then
            echo "::error::Info.plist must not contain LSFileQuarantineEnabled"; exit 1
          fi
          echo "Mac app OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
