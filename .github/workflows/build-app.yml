# Builds Eifel Mastering Central for Mac (Apple Silicon + Intel) and Windows (64-bit) on GitHub's computers.
# Start it: github.com > eifel-central > Actions > "Build app" > Run workflow.
# When it is finished (about 10-20 minutes), the downloads are at the bottom of the run's page, under "Artifacts".
# If the Mac job waits forever ("capacity constraints"): Run workflow again and pick "Intel Mac" - GitHub is often
# short of Apple Silicon Macs. The result is the same universal app (Apple Silicon + Intel).
# Tick "Publish a test release" to put the Mac app on github.com/ReckyReck/eifel-central/releases as a pre-release
# "central-vX.Y.Z" (X.Y.Z = version in src-tauri/tauri.conf.json): testers download it there without a GitHub account.
# A version can be published only once - raise the version for the next test build.
# (Later, step 9: releases will also carry the self-update files.)
name: Build app

on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Mac build computer"
        type: choice
        default: "Apple Silicon Mac (macos-15)"
        options:
          - "Apple Silicon Mac (macos-15)"
          - "Intel Mac (macos-15-intel)"
      publish:
        description: "Publish a test release (Mac app, pre-release) for testers"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple Silicon + Intel)
            os: ${{ contains(inputs.mac, 'intel') && 'macos-15-intel' || 'macos-15' }}
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: Eifel-Mastering-Central-Mac
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (64-bit)
            os: windows-2022
            args: --bundles nsis
            artifact: Eifel-Mastering-Central-Windows
            path: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust targets (Mac universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the build tools
        run: npm install --no-audit --no-fund

      - name: Check the code (TypeScript, strict)
        run: npm run check

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - name: Check the Mac app (ad-hoc signature, no quarantine flag)
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Eifel Mastering Central.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/"*)"; echo "Architectures: $ARCHS"
          case "$ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::not universal ($ARCHS)"; exit 1 ;; esac
          if /usr/libexec/PlistBuddy -c "Print :LSFileQuarantineEnabled" "$APP/Contents/Info.plist" >/dev/null 2>&1; then
            echo "::error::Info.plist must not contain LSFileQuarantineEnabled"; exit 1
          fi
          echo "Mac app OK"

      - name: Test the installer (offline tests + download and unpack every Mac plug-in of the live catalog, no install)
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish test release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Eifel-Mastering-Central-Mac
          path: dist

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          TAG="central-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published. Raise the version (tauri.conf.json, Cargo.toml, package.json) and build again."
            exit 1
          fi
          cat > notes.md <<NOTES
          Test build of Eifel Mastering Central $VERSION (alpha) for Mac (Apple Silicon and Intel).

          **First start**
          1. Download the .dmg below, open it and drag **Eifel Mastering Central** into **Applications**.
          2. Open the app. macOS says it cannot check it: click **Done**.
          3. System Settings > Privacy & Security: scroll down, click **Open Anyway** next to Eifel Mastering Central, enter your password.

          See the README for what this build can do.
          NOTES
          gh release create "$TAG" dist/*.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Eifel Mastering Central $VERSION (test)" --notes-file notes.md
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
