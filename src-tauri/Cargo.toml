[package]
name = "eifel-central"
version = "0.1.0"
description = "Eifel Mastering Central - installs and updates Recky's plug-ins"
authors = ["Eifel Mastering"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
