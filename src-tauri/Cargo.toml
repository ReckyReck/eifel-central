[package]
name = "eifel-central"
version = "0.2.0"
description = "Eifel Mastering Central - installs and updates Recky's plug-ins"
authors = ["Eifel Mastering"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
plist = "1"
# ZIP: only "deflate" (what macOS and the plug-in builds use); no extra codecs
zip = { version = "2", default-features = false, features = ["deflate"] }
# HTTPS download with rustls (no OpenSSL); follows GitHub's redirect to its download servers
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
